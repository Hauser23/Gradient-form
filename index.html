<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in or create an account to continue."
    />
    <title>Sign in</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="auth-screen">
      <section class="auth-panel" aria-labelledby="auth-title">
        <button id="back-button" class="back-button" type="button" aria-label="Go back">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path
              d="M12.5 15L7.5 10L12.5 5"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.7"
            />
          </svg>
        </button>

        <header class="auth-header">
          <h1 id="auth-title">
            <span id="mode-title">Sign in</span>
            <span class="mode-divider" aria-hidden="true">/</span>
            <button id="mode-toggle" class="mode-toggle" type="button">
              Sign up
            </button>
          </h1>
          <p id="auth-description">Fill the form to sign into account</p>
        </header>

        <form id="auth-form" novalidate>
          <div class="fields">
            <fieldset class="field">
              <legend><label for="email">Email</label></legend>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                value="yaq"
                required
              />
            </fieldset>

            <fieldset class="field">
              <legend><label for="password">Password</label></legend>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                minlength="8"
                required
              />
              <button
                id="password-toggle"
                class="password-toggle"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                  <path
                    d="M342.95 415.95C341.525 417.036 339.791 417.637 338 417.666C332.167 417.666 328.833 411 328.833 411C329.87 409.068 331.308 407.38 333.05 406.05M336.25 404.533C336.824 404.399 337.411 404.332 338 404.333C343.833 404.333 347.167 411 347.167 411C346.661 411.946 346.057 412.837 345.367 413.658M339.767 412.766C339.143 413.435 338.205 413.711 337.319 413.484C336.433 413.258 335.742 412.566 335.515 411.681C335.289 410.795 335.564 409.856 336.233 409.233"
                    transform="translate(-328 -401)"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.66667"
                  />
                  <path
                    d="M328.833 401.833L347.167 420.166"
                    transform="translate(-328 -401)"
                    fill="none"
                    stroke="currentColor"
                    class="eye-slash"
                    stroke-width="1.66667"
                  />
                </svg>
              </button>
            </fieldset>
          </div>

          <div class="form-options">
            <a id="forgot-password" href="#forgot-password">Forgot password</a>
            <label class="remember-option" for="remember">
              <input id="remember" name="remember" type="checkbox" checked />
              <span class="switch" aria-hidden="true"></span>
              <span>Remember</span>
            </label>
          </div>

          <button class="submit-button" type="submit">
            <span id="submit-label">Sign In</span>
          </button>
        </form>

        <div class="social-section">
          <div class="separator">
            <span>Or continue with</span>
          </div>
          <div class="social-buttons" aria-label="Social sign-in options">
            <button
              class="social-button"
              type="button"
              aria-label="Continue with Facebook"
              data-provider="Facebook"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  transform="translate(-127 -687)"
                  d="M137 687.06C131.5 687.06 127 691.56 127 697.06C127 702 130.61 706.12 135.33 706.95L135.39 706.9H135.33V699.84H132.83V697.06H135.33V694.84C135.33 692.34 136.94 690.95 139.22 690.95C139.94 690.95 140.72 691.06 141.44 691.17V693.73H140.16C138.94 693.73 138.66 694.34 138.66 695.12V697.06H141.33L140.89 699.84H138.67V706.9H138.61L138.67 706.95C143.39 706.12 147 702.01 147 697.06C147 691.56 142.5 687.06 137 687.06Z"
                />
              </svg>
            </button>
            <button
              class="social-button"
              type="button"
              aria-label="Continue with GitHub"
              data-provider="GitHub"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 1.73 2.64 1.23 3.28.94.1-.73.39-1.23.7-1.51-2.51-.29-5.15-1.26-5.15-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.65 0c2.15-1.45 3.09-1.15 3.09-1.15.62 1.55.23 2.7.12 2.98.72.79 1.15 1.79 1.15 3.02 0 4.31-2.64 5.27-5.16 5.55.4.35.76 1.03.76 2.08v3.08c0 .3.21.65.78.54A11.25 11.25 0 0 0 12 .75Z"
                />
              </svg>
            </button>
            <button
              class="social-button"
              type="button"
              aria-label="Continue with Instagram"
              data-provider="Instagram"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2" />
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
                <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
